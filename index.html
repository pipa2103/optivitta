  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #f5f5f5;
      font-family: 'Inter', sans-serif;
      padding: 20px;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    .main-card {
      background: #ffffff;
      border-radius: 0;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }

    /* ============================================ */
    /* HEADLINE - FUNDO AZUL ESCURO (#0d1f38) */
    /* ============================================ */
    .headline {
      background: #0d1f38;
      padding: 40px 40px 30px 40px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      border-bottom: 2px solid #ffffff;
      padding-bottom: 15px;
    }

    /* Container do ícone + texto NBC NEWS */
    .nbc-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Símbolo da NBC */
    .nbc-symbol {
      width: 55px;
      display: inline-block;
    }

    .nbc-symbol svg {
      width: 100%;
      height: auto;
      display: block;
    }

    /* Texto NBC NEWS ao lado do ícone */
    .nbc-text {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -1px;
      color: #ffffff;
    }

    .watch-text {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 3px;
      color: #ffffff;
    }

    .breaking-news {
      color: #ff8888;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 15px;
      text-transform: uppercase;
    }

    .exclusive {
      color: #ff8888;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 2px;
      margin-bottom: 20px;
      text-transform: uppercase;
    }

    .main-title {
      font-size: 42px;
      font-weight: 800;
      line-height: 1.2;
      color: #ffffff;
      margin-bottom: 25px;
    }

    /* ============================================ */
    /* VÍDEO */
    /* ============================================ */
    .video-section {
      padding: 0 40px 40px 40px;
      background: #ffffff;
    }

    .video-wrapper {
      background: #e8e8e8;
      border-radius: 8px;
      overflow: hidden;
      min-height: 400px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .video-placeholder {
      text-align: center;
      padding: 80px 40px;
      width: 100%;
      cursor: pointer;
    }

    .video-placeholder-icon {
      font-size: 64px;
      margin-bottom: 20px;
    }

    .video-placeholder-text {
      font-size: 20px;
      font-weight: 600;
      color: #333;
      margin-bottom: 10px;
    }

    .video-placeholder-sub {
      color: #666;
      font-size: 14px;
    }

    /* ============================================ */
    /* RESPONSIVO */
    /* ============================================ */
    @media (max-width: 768px) {
      body {
        padding: 10px;
      }

      .headline {
        padding: 25px 20px;
      }

      .main-title {
        font-size: 28px;
      }

      .video-section {
        padding: 0 20px 25px 20px;
      }

      .video-placeholder {
        padding: 50px 20px;
      }

      .nbc-symbol {
        width: 45px;
      }

      .nbc-text {
        font-size: 22px;
      }
    }

    @media (max-width: 480px) {
      .main-title {
        font-size: 24px;
      }

      .watch-text {
        font-size: 14px;
      }

      .nbc-text {
        font-size: 18px;
      }

      .nbc-symbol {
        width: 38px;
      }

      .video-placeholder-icon {
        font-size: 48px;
      }

      .video-placeholder-text {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="main-card">

      <!-- HEADLINE - FUNDO AZUL ESCURO COM ÍCONE + TEXTO NBC NEWS -->
      <div class="headline">
        <div class="top-bar">
          <div class="nbc-brand">
            <!-- Símbolo da NBC -->
            <div class="nbc-symbol">
              <svg viewBox="0 0 370 345" xmlns="http://www.w3.org/2000/svg">
                <path d="M180 260 L124 128 C114 101 136 68 162 68 C185 68 196 87 188 111 Z" fill="#f41245"/>
                <path d="M171 244 L73 173 C50 157 51 124 77 116 C101 109 119 121 130 150 Z" fill="#ff7417"/>
                <path d="M180 260 L67 260 C39 260 21 240 31 214 C39 193 63 184 85 197 Z" fill="#ffca16"/>
                <path d="M214 260 L327 260 C355 260 373 240 363 214 C355 193 331 184 309 197 Z" fill="#00b44b"/>
                <path d="M222 244 L320 173 C343 157 342 124 316 116 C292 109 274 121 263 150 Z" fill="#169bd7"/>
                <path d="M218 226 L203 130 C199 113 214 105 226 107 L202 104 C201 84 215 68 237 68 C260 68 276 86 270 108 Z" fill="#6b50d8"/>
              </svg>
            </div>
            <span class="nbc-text">NBC NEWS</span>
          </div>
          <span class="watch-text">WATCH</span>
        </div>
        
        <div class="breaking-news">BREAKING NEWS</div>
        <div class="exclusive">EXCLUSIVE HEALTH INVESTIGATION</div>
        
        <div class="main-title">
          Dr. Ming Wang's protocol demonstrates "self-repair" in weakened eyes, restoring vision to millions of people.
        </div>
        
      </div>

      <!-- VÍDEO -->
      <div class="video-section">
        <div class="video-wrapper">
          <div class="video-placeholder" onclick="alert('📺 Aqui será inserido o vídeo. Substitua este bloco pelo código embed do YouTube ou Vimeo.')">
            <div class="video-placeholder-icon">🎬</div>
            <div class="video-placeholder-text">Espaço para o vídeo</div>
            <div class="video-placeholder-sub">Clique para instruções</div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script>
    console.log('%c✨ Site atualizado: novo título, sem texto clínico e sem footer ✨', 'color: #0d1f38; font-size: 14px;');
  </script>
</body>
</html>
